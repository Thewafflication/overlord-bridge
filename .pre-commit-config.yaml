minimum_pre_commit_version: '4.3.0'
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
fail_fast: true
repos:
  - repo: local
    hooks:
      - id: project-lint
        name: Python syntax checks
        entry: python tools/check.py lint
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
      - id: project-build
        name: Build project wheel
        entry: python tools/check.py build
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
      - id: project-tests
        name: Full offline Python suite
        entry: python tools/check.py test
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
