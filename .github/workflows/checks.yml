name: Project checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Provision Tcl for headless console tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pre_commit validate-config
      - run: python tools/check.py all
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checks-${{ matrix.os }}
          path: out/checks/
          if-no-files-found: error
