[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "overlord-bridge"
version = "0.1.0"
description = "Drive a home-rooted Overlord agent from Telegram (Claude/Codex control bridge)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Thewafflication" }]
dependencies = [
    "python-telegram-bot==22.8",
    "claude-agent-sdk==0.2.103",
    "aiohttp==3.14.1",
    "playwright==1.61.0",
    "playwright-stealth==2.0.3",
    "trafilatura==2.1.0",
    "pyte",
    "pystray==0.19.5",
    "Pillow==11.3.0",
]

[project.urls]
Homepage = "https://github.com/Thewafflication/overlord-bridge"

[project.scripts]
overlord-bridge = "bridge:main"

# The distributable Python surface is the top-level bridge module plus the
# modules package. Shell entry points (overlord, overlord-email) and runtime
# directories are intentionally excluded from the wheel.
[tool.setuptools]
py-modules = ["bridge"]
packages = ["modules"]
